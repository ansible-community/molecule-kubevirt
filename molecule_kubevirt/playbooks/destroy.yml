---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  vars:
    default_namespace: "default"

  tasks:
    - name: Load saved runtime platform info
      slurp:
        src: "{{ molecule_ephemeral_directory }}/platforms_rt.yml"
      register: platforms_rt_raw

    - name: Parse platform info
      set_fact:
        platforms_rt: "{{ platforms_rt_raw.content | b64decode | from_yaml }}"

    - name: Delete VM
      k8s:
        state: absent
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ item.namespace | default(default_namespace) }}"
      loop: "{{ platforms_rt }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: Delete VMI
      k8s:
        state: absent
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ item.vm_name }}"
        namespace: "{{ item.namespace | default(default_namespace) }}"
      loop: "{{ platforms_rt }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: Delete Service
      k8s:
        state: absent
        api_version: v1
        kind: Service
        name: "{{ item.vm_name }}"
        namespace: "{{ item.namespace | default(default_namespace) }}"
      loop: "{{ platforms_rt }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: Delete Secret
      k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item.vm_name }}"
        namespace: "{{ item.namespace | default(default_namespace) }}"
      loop: "{{ platforms_rt }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: Delete SSH key pair
      file:
        path: "{{ molecule_ephemeral_directory }}/identity_{{ item.name }}"
        state: absent
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
